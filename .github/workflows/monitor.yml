name: Aircraft Monitor

on:
  # 定期監視はMacのlaunchdに一本化する。GitHub Actionsからの自動実行を
  # 併用すると、別々のnotified.jsonを基に同じ機体を重複通知してしまう。
  workflow_dispatch:

# 手動実行を連打しても、同じ監視処理を並列に走らせない。
concurrency:
  group: aircraft-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run aircraft monitor
        run: python monitor.py
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AIRCRAFT_WEBHOOK_URL: ${{ secrets.AIRCRAFT_WEBHOOK_URL }}

      - name: Commit notified.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add notified.json
          git diff --staged --quiet || git commit -m "update notified state"
          git pull --rebase
          git push
